<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataAgent</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e6e6e9;
    --border-strong: #d4d4d8;
    --text: #18181b;
    --text-2: #52525b;
    --text-3: #9f9fa8;
    --accent: #4f46e5;
    --accent-text: #4338ca;
    --accent-soft: #eef2ff;
    --green: #16a34a;
    --green-soft: #f0fdf4;
    --red: #dc2626;
    --red-soft: #fef2f2;
    --yellow: #d97706;
    --yellow-soft: #fffbeb;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,.07);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  button { font-family: inherit; }

  /* ============ 图标 ============ */
  .ic { width: 15px; height: 15px; flex-shrink: 0; }
  .ic-spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ 顶栏 ============ */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 20px; flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-badge {
    width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(79,70,229,.3);
  }
  .brand-badge .ic { width: 18px; height: 18px; }
  .brand-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .brand-sub { font-size: 12px; color: var(--text-3); line-height: 1.3; margin-top: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid; font-weight: 500; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-ok { color: var(--green); border-color: #bbf7d0; background: var(--green-soft); }
  .badge-err { color: var(--red); border-color: #fecaca; background: var(--red-soft); }

  .btn-ghost, .btn-grad { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 6px 11px; border-radius: 8px; cursor: pointer; transition: all .15s; }
  .btn-ghost { background: #fff; border: 1px solid var(--border); color: var(--text-2); }
  .btn-ghost:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .btn-ghost:disabled { opacity: .5; cursor: not-allowed; }
  .btn-danger:hover:not(:disabled) { color: var(--red); border-color: #fecaca; background: var(--red-soft); }
  .btn-grad { background: var(--accent); border: 1px solid transparent; color: #fff; font-weight: 500; }
  .btn-grad:hover:not(:disabled) { background: var(--accent-text); }
  .btn-grad:disabled { opacity: .45; cursor: not-allowed; }

  /* ============ 主体 ============ */
  .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  #messages {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 24px 24px 40px;
    display: flex; flex-direction: column; gap: 24px;
  }
  #messages > * { width: 100%; }

  .empty-hint { text-align: center; color: var(--text-3); padding: 80px 0; }
  .empty-hint .icon-box {
    width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 14px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .empty-hint .icon-box .ic { width: 24px; height: 24px; }
  .empty-hint p { font-size: 14px; font-weight: 500; color: var(--text-2); margin-top: 8px; }
  .empty-hint .s { font-size: 12px; color: var(--text-3); font-weight: 400; margin-top: 4px; }

  /* ============ 输入区 ============ */
  .composer { background: var(--card); border-top: 1px solid var(--border); padding: 14px 16px 12px; flex-shrink: 0; }
  .composer-inner {
    display: flex; align-items: flex-end; gap: 10px;
    background: #fff; border: 1px solid var(--border-strong); border-radius: 12px;
    padding: 6px 6px 6px 14px; transition: border-color .15s, box-shadow .15s;
  }
  .composer-inner:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  #question-input { flex: 1; border: none; outline: none; font-size: 14px; color: var(--text); background: transparent; padding: 9px 0; }
  #question-input::placeholder { color: var(--text-3); }
  #question-input:disabled { cursor: not-allowed; }
  .send-btn {
    width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    border: none; transition: background .15s, opacity .15s; flex-shrink: 0;
  }
  .send-btn .ic { width: 17px; height: 17px; }
  .send-btn:hover:not(:disabled) { background: var(--accent-text); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; }
  .composer-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .example-btn {
    font-size: 12px; padding: 5px 12px; background: #fff; color: var(--text-2);
    border: 1px solid var(--border); border-radius: 999px; cursor: pointer; transition: all .15s;
  }
  .example-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .example-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ============ 消息 ============ */
  .msg-user { display: flex; justify-content: flex-end; }
  .bubble-user {
    max-width: min(560px, 90%); background: var(--accent); color: #fff;
    font-size: 13px; line-height: 1.6; padding: 9px 14px;
    border-radius: 12px 12px 3px 12px; box-shadow: var(--shadow-sm);
  }
  .msg-ai { display: flex; }
  .ai-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .ai-card-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #f4f4f5; }
  .ai-avatar {
    width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .ai-avatar .ic { width: 14px; height: 14px; }
  .ai-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .ai-status { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }
  .ai-card-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

  .st-running { color: var(--accent); }
  .st-ok { color: var(--green); }
  .st-warn { color: var(--yellow); }
  .st-err { color: var(--red); }
  .st-neutral { color: var(--text-3); }

  .action-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .action-btn {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; color: var(--text-2); cursor: pointer; transition: all .15s;
  }
  .action-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .action-btn:disabled { opacity: .55; cursor: not-allowed; }

  .insight-card { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
  .insight-title { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--accent-text); margin-bottom: 5px; }
  .insight-body { font-size: 13px; color: var(--text); line-height: 1.65; margin: 0; }
  .suggest-box { display: flex; flex-direction: column; gap: 6px; }
  .suggest-title { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--text-3); margin: 0; }
  .suggestion-btn {
    display: block; width: 100%; text-align: left; font-size: 12px; padding: 8px 12px;
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-2); cursor: pointer; transition: all .15s;
  }
  .suggestion-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  .chart-card { border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: #fff; box-shadow: var(--shadow-sm); }
  .chart-title { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-2); margin: 0 0 12px; }
  .chart-iframe-wrap { width: 100%; height: 380px; }
  .lieflat-frame { width: 100%; height: 100%; border: 0; border-radius: 8px; display: block; }

  .report-card { border: 1px solid var(--accent); border-radius: 12px; overflow: hidden; background: #fff; box-shadow: var(--shadow-sm); }
  .report-card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid #eef2ff; background: var(--accent-soft);
  }
  .report-label { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--accent-text); }
  .report-card-body { padding: 20px; max-height: 600px; overflow-y: auto; }

  .result-meta { font-size: 12px; color: var(--text-3); margin: 0 0 8px; }
  .result-card { border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: 384px; background: #fff; box-shadow: var(--shadow-sm); }
  .result-table { border-collapse: collapse; width: 100%; }
  .result-table th {
    position: sticky; top: 0; z-index: 1; background: #fafafa; border-bottom: 1px solid var(--border);
    color: var(--text-2); font-weight: 600; text-align: left; white-space: nowrap; padding: 8px 12px; font-size: 12px;
  }
  .result-table td { border-bottom: 1px solid #f4f4f5; padding: 6px 12px; white-space: nowrap; font-size: 12px; color: var(--text-2); }
  .result-table tbody tr:hover td { background: #fafafa; }

  .ai-code summary { cursor: pointer; color: var(--text-3); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; user-select: none; }
  .ai-code summary:hover { color: var(--accent); }
  .ai-code pre {
    background: #18181b; color: #f4f4f5; padding: 12px 14px; border-radius: 10px; margin: 8px 0 0;
    overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
  }

  /* ============ Markdown 报告 ============ */
  .report-content { font-size: 13px; line-height: 1.7; color: var(--text-2); }
  .report-content h1 { font-size: 20px; font-weight: 700; margin: 0 0 16px; color: var(--text); padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .report-content h2 { font-size: 16px; font-weight: 600; margin: 20px 0 10px; color: var(--text); padding-left: 10px; border-left: 3px solid var(--accent); }
  .report-content h3 { font-size: 14px; font-weight: 600; margin: 14px 0 8px; color: var(--text); }
  .report-content p { margin: 6px 0; }
  .report-content ul, .report-content ol { margin: 6px 0; padding-left: 24px; }
  .report-content li { margin: 3px 0; }
  .report-content table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12px; }
  .report-content th { background: #fafafa; padding: 6px 8px; border: 1px solid var(--border); text-align: left; font-weight: 600; color: var(--text-2); }
  .report-content td { padding: 5px 8px; border: 1px solid var(--border); }
  .report-content tr:hover { background: #fafafa; }
  .report-content code { background: #f0f0f1; color: var(--accent-text); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .report-content strong { color: var(--text); font-weight: 600; }
  .report-content blockquote { border-left: 3px solid var(--border-strong); background: #fafafa; margin: 8px 0; padding: 6px 12px; color: var(--text-2); border-radius: 0 8px 8px 0; }
  .report-content a { color: var(--accent); }

  /* ============ 弹窗 ============ */
  .modal-mask {
    position: fixed; inset: 0; z-index: 50; background: rgba(24,24,27,.45); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-shell { background: #fff; width: 100%; max-width: 1024px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .modal-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text); margin: 0; }
  .modal-title .ic { color: var(--accent); }
  .modal-sub { font-size: 12px; color: var(--text-3); font-weight: 400; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
  .modal-status { padding: 10px 20px; background: #fafafa; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-3); line-height: 1.6; }
  .modal-loading, .modal-error { text-align: center; padding: 48px 0; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .modal-loading { color: var(--text-3); }
  .modal-error { color: var(--red); }

  .notes-bar { padding: 10px 20px; background: var(--yellow-soft); border-bottom: 1px solid #fde68a; font-size: 12px; color: #92400e; line-height: 1.6; display: flex; align-items: center; gap: 6px; }
  .notes-bar .ic { flex-shrink: 0; }
  .notes-bar code { background: #fef3c7; padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
  .notes-info { background: #eff6ff; border-bottom-color: #bfdbfe; color: #1e40af; }
  .notes-info code { background: #dbeafe; }
  .token-bar { padding: 10px 20px; background: #fafafa; border-bottom: 1px solid var(--border); font-size: 12px; display: flex; align-items: center; gap: 8px; color: var(--text-2); }
  .token-bar .ic { color: var(--text-3); }
  #admin-token-input, #memory-token-input { flex: 1; font-family: ui-monospace, Menlo, Consolas, monospace; }

  /* ============ 配置/记忆表单 ============ */
  #admin-form { display: flex; flex-direction: column; gap: 16px; }
  #memory-form { display: flex; flex-direction: column; gap: 10px; }
  .rule-section { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .rule-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
  .rule-title { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; margin: 0; }
  .rule-title .ic { color: var(--accent); }
  .rule-sub { font-size: 12px; color: var(--text-3); font-weight: 400; }
  .rule-body { background: #fafafa; border: 1px solid #f0f0f1; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .rule-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .rule-stack { display: flex; flex-direction: column; gap: 10px; }
  .rule-row { background: #fafafa; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .row-desc { margin-top: 10px; }
  .empty-note { font-size: 12px; color: var(--text-3); text-align: center; padding: 16px 0; font-style: italic; }
  .field-label { display: block; font-size: 11px; font-weight: 500; color: var(--text-3); margin-bottom: 4px; }
  .chk-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; padding-top: 4px; }
  .chk-cell { padding-top: 20px; }
  .del-cell { padding-top: 20px; text-align: center; }
  .icon-del {
    display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    border-radius: 7px; color: var(--text-3); background: transparent; border: none; cursor: pointer; transition: all .15s;
  }
  .icon-del:hover { color: var(--red); background: var(--red-soft); }
  .input-sub { font-size: 12px; color: var(--text-3); margin-top: 6px; }
  .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .form-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; align-items: start; }
  .c1 { grid-column: span 1; }
  .c2 { grid-column: span 2; }
  .c3 { grid-column: span 3; }
  .c4 { grid-column: span 4; }
  .c5 { grid-column: span 5; }

  .input-modern {
    width: 100%; border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 10px;
    font-size: 13px; background: #fff; color: var(--text); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-modern:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  .input-modern:disabled { background: #f4f4f5; color: var(--text-3); }
  select.input-modern { padding: 6px 8px; }
  textarea.input-modern { resize: none; line-height: 1.5; }
  input[type="range"] { accent-color: var(--accent); }
  input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; margin: 0; }

  .mem-head { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; padding: 0 4px; font-size: 11px; color: var(--text-3); font-weight: 500; }
  .mem-addbar { padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .hint { font-size: 12px; color: var(--text-3); }
  .mem-key-col, .mem-val-col { display: flex; flex-direction: column; gap: 6px; }
  .mem-meta { font-size: 11px; color: var(--text-3); display: flex; flex-direction: column; gap: 3px; padding-top: 2px; }
  .mem-from { display: inline-flex; align-items: center; gap: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem-time { display: inline-flex; align-items: center; gap: 4px; }
  .mem-meta .ic { width: 12px; height: 12px; flex-shrink: 0; }
  .conf-row { display: flex; align-items: center; gap: 6px; }
  .conf-range { flex: 1; }
  .conf-num { width: 46px; text-align: center; font-size: 12px; padding: 3px 4px; border: 1px solid var(--border-strong); border-radius: 6px; color: var(--text); }
  .conf-evidence { font-size: 11px; color: var(--text-3); margin-top: 4px; }
  .src-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid; font-weight: 500; white-space: nowrap; }
  .src-manual { color: #2563eb; border-color: #bfdbfe; background: #eff6ff; }
  .src-auto { color: var(--green); border-color: #bbf7d0; background: var(--green-soft); }
  .src-cell { padding-top: 6px; text-align: center; }
  .empty-state { text-align: center; color: var(--text-3); padding: 48px 0; }
  .empty-state .icon-box { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 12px; background: #f4f4f5; color: var(--text-3); display: flex; align-items: center; justify-content: center; }
  .empty-state .icon-box .ic { width: 22px; height: 22px; }
  .empty-state p.m { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 0; }
  .empty-state p.s { font-size: 12px; margin-top: 4px; }

  /* ============ 动效 / 工具 ============ */
  .thinking { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  .dot-flashing { animation: dotFlashing 1s ease-in-out infinite; }
  @keyframes dotFlashing { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  .msg-enter { animation: slideIn .25s ease-out; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .hidden { display: none !important; }
  .opacity-60 { opacity: .6; }
  .opacity-50 { opacity: .5; }

  .scroll-area::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
  .scroll-area::-webkit-scrollbar-thumb:hover { background: #b8b8bd; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="brand-badge">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
    </div>
    <div>
      <h1 class="brand-title">DataAgent</h1>
      <p class="brand-sub" id="datasource-summary">加载中...</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="llm-badge" class="badge"></span>

function safeMarkdown(md) {
  const renderer = new marked.Renderer();
  const origLink = renderer.link.bind(renderer);
  renderer.link = (href, title, text) => {
    const ok = /^(https?:|mailto:|#|\/)/i.test(href || '');
    return ok ? origLink(href, title, text) : `<span>${text}</span>`;
  };
  renderer.image = () => '';
  renderer.html = () => '';
  return marked.parse(md, { renderer });
}

let sessionId = null;
let busy = false;

async function bootstrap() {
  const h = await fetch('/api/health').then(r => r.json());
  const badge = $('llm-badge');
  if (h.llm_configured) {
    badge.innerHTML = `<span class="badge-dot"></span>${h.llm_model}`;
    badge.className = 'badge badge-ok';
  } else {
    badge.innerHTML = `<span class="badge-dot"></span>未配 LLM`;
    badge.className = 'badge badge-err';
  }

  const ds = h.data_source;
  $('datasource-summary').textContent = `${ds.label || ds.filename} · ${ds.rows.toLocaleString()} 行 × ${ds.columns} 列`;

  $('question-input').disabled = false;
  $('send-btn').disabled = false;
  $('question-input').focus();
}

function enableSessionReport() {
  // 第一个 AI 回答后启用
  const btn = $('session-report-btn');
  if (btn && sessionId) {
    btn.disabled = false;
    btn.classList.remove('opacity-50');
  }
}

async function sendQuestion(question) {
  if (busy || !question.trim()) return;
  busy = true;

  $('empty-hint')?.remove();
  appendUserMessage(question);
  $('question-input').value = '';
  setInputEnabled(false);

  const aiMsg = appendAIMessage();

  const formData = new FormData();
  formData.append('question', question);
  if (sessionId) formData.append('session_id', sessionId);

  try {
    const r = await fetch('/api/analyze', { method: 'POST', body: formData });
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const evt = JSON.parse(line.slice(6));
          handleEvent(evt, aiMsg);
        } catch (e) { console.error('parse', e, line); }
      }
    }
  } catch (e) {
    aiMsg.querySelector('.ai-status').innerHTML = `<span class="st-err">${IC.alert} 网络错误:${e.message}</span>`;
  }

  busy = false;
  setInputEnabled(true);
  $('question-input').focus();
  scrollToBottom();
}

function handleEvent(evt, aiMsg) {
  const statusEl = aiMsg.querySelector('.ai-status');
  const codeEl = aiMsg.querySelector('.ai-code pre');
  const resultEl = aiMsg.querySelector('.ai-result');
  const analysisEl = aiMsg.querySelector('.ai-analysis');

  if (evt.event === 'session') {
    sessionId = evt.session_id;
    enableSessionReport();
  } else if (evt.event === 'start') {
    statusEl.innerHTML = `<span class="st-running">${IC.spinner} 思考中</span>`;
  } else if (evt.event === 'code') {
    codeEl.textContent = evt.code;
    aiMsg.querySelector('.ai-code').classList.remove('hidden');
    statusEl.innerHTML = `<span class="st-running">${IC.spinner} 执行中</span>`;
  } else if (evt.event === 'retry') {
    statusEl.innerHTML = `<span class="st-warn">${IC.alert} 第 ${evt.attempt} 次重试 · ${evt.last_error}</span>`;
  } else if (evt.event === 'result') {
    renderResult(evt.data, resultEl);
    aiMsg._resultData = evt.data;
    aiMsg._code = evt.code;
    aiMsg._question = evt.question;
    statusEl.innerHTML = `<span class="st-ok">${IC.check} ${evt.data.row_count} 行</span>`;
    const insightBtn = aiMsg.querySelector('.ai-insight-btn');
    const chartBtn = aiMsg.querySelector('.ai-chart-btn');
    const reportBtn = aiMsg.querySelector('.ai-report-btn');
    if (insightBtn) insightBtn.classList.remove('hidden');
    if (chartBtn) chartBtn.classList.remove('hidden');
    if (reportBtn) reportBtn.classList.remove('hidden');
  } else if (evt.event === 'analyzing') {
    statusEl.innerHTML = `<span class="st-running">${IC.spinner} 分析中</span>`;
  } else if (evt.event === 'analysis') {
    renderAnalysis(evt.data, analysisEl);
    statusEl.innerHTML = `<span class="st-ok">${IC.check} 完成</span>`;
  } else if (evt.event === 'error') {
    statusEl.innerHTML = `<span class="st-err">${IC.alert} ${evt.message}</span>`;
  } else if (evt.event === 'done') {
    // 完成
  }
}

function renderAnalysis(data, container) {
  const { insight, suggestions = [] } = data;
  let html = '';
  if (insight) {
    html += `<div class="insight-card">
      <p class="insight-title">${IC.bulb} AI 洞察</p>
      <p class="insight-body insight-text">${escapeHtml(insight)}</p>
    </div>`;
  }
  if (suggestions.length > 0) {
    html += `<div class="suggest-box">
      <p class="suggest-title">${IC.sparkles} 你可以接着问:</p>`;
    suggestions.forEach(s => {
      html += `<button class="suggestion-btn" data-q="${escapeHtml(s)}">${escapeHtml(s)}</button>`;
    });
    html += `</div>`;
  }
  container.innerHTML = html;
  container.querySelectorAll('.suggestion-btn').forEach(btn => {
    btn.addEventListener('click', () => sendQuestion(btn.dataset.q));
  });
}

function renderResult(data, container) {
  const { columns, rows, row_count } = data;
  let html = `<p class="result-meta">共 ${row_count} 行${rows.length < row_count ? ` · 展示前 ${rows.length} 行` : ''} · <span class="muted">数字保留 2 位小数,率/占比自动加 %</span></p>`;
  html += `<div class="result-card"><table class="result-table w-full">`;
  html += '<thead><tr>';
  columns.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr>';
    row.forEach((cell, i) => {
      html += `<td>${formatCell(cell, columns[i])}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  container.innerHTML = html;
}

// 智能格式化单元格
// - 率/同比/占比 → 百分数 2 位(原值 * 100 + %)
// - ID/编号 → 整数
// - 数字(销量/金额/数量/同期/sum/cur/prev/元/值) → 2 位小数 + 千分位
// - 其他 → 字符串原样
function formatCell(value, columnName) {
  if (value === null || value === undefined || value === '') return value;
  const s = String(value);
  const col = (columnName || '').toLowerCase();
  const num = parseFloat(s);
  if (isNaN(num) || !isFinite(num)) return escapeHtml(s);

  // 整数 ID/编号(不格式化千分位)
  if (/编号$|员工编号|id$|代码$/.test(col)) {
    return num.toFixed(0);
  }

  // 率/同比/占比/份额(含英文 rate/ratio/pct/growth)→ 百分数 2 位(原值 * 100 + %)
  // 约定:后端 prompt 已强制 LLM 输出小数比率(0.99=99%),这里统一 ×100 显示
  if (/率|同比|占比|份额|百分数|百分比|percent|rate|ratio|pct|growth|%\s*$/.test(col)) {
    return (num * 100).toFixed(2) + '%';
  }

  // 数字字段(销量/金额/数量/同期/cur/prev/sum/万元/元/值/额度)→ 2 位小数 + 千分位
  if (/销量|金额|数量|同期|本期|上期|sum|cur|prev|万元|元$|值$|额度|销售|规模/.test(col)) {
    return num.toLocaleString('zh-CN', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  }

  // 兜底:其他纯数值列(如学术接受度/指数/占比值)→ 整数保持整数,小数 2 位 + 千分位
  // 非纯数字字符串(日期/编号/文本)保持原样,避免误格式化
  const trimmed = s.trim();
  if (!/^-?\d[\d,]*(\.\d+)?$/.test(trimmed)) return escapeHtml(s);
  const cleanNum = parseFloat(trimmed.replace(/,/g, ''));
  return cleanNum.toLocaleString('zh-CN', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2,
  });
}

async function loadReport(aiMsg) {
  const btn = aiMsg.querySelector('.ai-report-btn');
  const statusEl = aiMsg.querySelector('.ai-status');
  const reportEl = aiMsg.querySelector('.ai-report');
  if (!aiMsg._resultData) return;

  btn.disabled = true;
  btn.innerHTML = `<span class="st-running">${IC.spinner} 撰写中</span>`;
  statusEl.innerHTML = `<span class="st-running">${IC.spinner} 撰写报告</span>`;

  try {
    // 如果已有 insight,把它也带上,让 LLM 整合到报告里
    let insight = aiMsg._insight || '';
    if (!insight) {
      const insightEl = aiMsg.querySelector('.ai-analysis .insight-text');
      if (insightEl) insight = insightEl.textContent || '';
    }

    const fd = new FormData();
    fd.append('question', aiMsg._question);
    fd.append('result_json', JSON.stringify(aiMsg._resultData));
    if (insight) fd.append('insight', insight);
    if (sessionId) fd.append('session_id', sessionId);

    const r = await fetch('/api/report', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();

    // 渲染 markdown(白名单 sanitize,防 LLM 注入 HTML/脚本)
    const html = safeMarkdown(data.report);
    const filename = `report_${Date.now()}.md`;
    reportEl.innerHTML = `
      <div class="report-card">
        <div class="report-card-head">
          <span class="report-label">${IC.file} 分析报告(可下载 markdown)</span>
          <div class="modal-actions">
            <button class="btn-ghost" data-action="copy-md">${IC.copy} 复制</button>
            <button class="btn-grad" data-action="download-md" data-filename="${filename}">${IC.download} 下载 .md</button>
          </div>
        </div>
        <div class="report-card-body report-content">${html}</div>
      </div>
    `;
    // 缓存
    aiMsg._report = data.report;
    aiMsg._reportFilename = filename;
    // 绑定按钮
    reportEl.querySelector('[data-action="copy-md"]').addEventListener('click', () => {
      navigator.clipboard.writeText(data.report).then(() => {
        btn.innerHTML = `${IC.check} 已复制`;
      });
    });
    reportEl.querySelector('[data-action="download-md"]').addEventListener('click', () => {
      downloadMarkdown(data.report, filename);
    });

    btn.innerHTML = `${IC.check} 已生成`;
    btn.classList.add('opacity-60');
    statusEl.innerHTML = `<span class="st-ok">${IC.check} 完成</span>`;
  } catch (e) {
    btn.innerHTML = `${IC.alert} 失败,重试`;
    btn.disabled = false;
    statusEl.innerHTML = `<span class="st-err">${IC.alert} ${e.message}</span>`;
  }
}

function downloadMarkdown(content, filename) {
  const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  const filters = r.filters || [];

  let html = '';

  // === 过滤规则 ===

  html += `

  html += `

  });
  if (formatRules.length === 0) {
    html += `<p class="empty-note">没有格式规则,所有列用全局默认</p>`;
  }
  html += `</div></section>`;

  // === 指标计算规则 ===
  const calcRules = (_adminRules.calculation_rules && _adminRules.calculation_rules.rules) || [];
  html += `
    <section class="rule-section">
      <div class="rule-section-head">
        <h3 class="rule-title">${IC.calc} 指标计算规则 <span class="rule-sub">(配置 LLM 怎么算同比/达成/各种衍生指标)</span></h3>
        <button id="calc-rule-add" class="btn-grad">${IC.plus} 添加计算规则</button>
      </div>
      <div class="rule-stack">
  `;
  calcRules.forEach((r, i) => {
    html += renderCalcRuleRow(r, i);
  });
  if (calcRules.length === 0) {
    html += `<p class="empty-note">还没有计算规则,点"添加计算规则"开始</p>`;
  }
  html += `</div></section>`;

  $('admin-form').innerHTML = html;

  // 绑定添加规则按钮
  $('filter-add').addEventListener('click', () => {
    _adminRules.filters = _adminRules.filters || [];
    _adminRules.filters.push({ name: '', description: '', priority: 'medium' });
    renderAdminForm();
  });

  // 绑定每行的删除/更新
  document.querySelectorAll('.filter-row').forEach((row, i) => {
    row.querySelector('.filter-del').addEventListener('click', () => {
      _adminRules.filters.splice(i, 1);
      renderAdminForm();
    });
  });

  // 绑定 format_rule 添加/删除
  $('format-rule-add')?.addEventListener('click', () => {
    _adminRules.output_style = _adminRules.output_style || {};
    _adminRules.output_style.format_rules = _adminRules.output_style.format_rules || [];
    _adminRules.output_style.format_rules.push({
      name: '',
      apply_to_columns: [],
      decimal_places: 2,
      thousand_separator: true,
      prefix: '',
      suffix: '',
      multiplier: 1,
      description: '',
    });
    renderAdminForm();
  });
  document.querySelectorAll('.format-rule-del').forEach((btn) => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i, 10);
      _adminRules.output_style.format_rules.splice(i, 1);
      renderAdminForm();
    });
  });

  // 绑定 calc_rule 添加/删除
  $('calc-rule-add')?.addEventListener('click', () => {
    _adminRules.calculation_rules = _adminRules.calculation_rules || { rules: [] };
    _adminRules.calculation_rules.rules = _adminRules.calculation_rules.rules || [];
    _adminRules.calculation_rules.rules.push({
      name: '',
      formula: '',
      description: '',
      category: 'growth',
      output_format: 'rate_pct',
      priority: 'medium',
    });
    renderAdminForm();
  });
  document.querySelectorAll('.calc-rule-del').forEach((btn) => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i, 10);
      _adminRules.calculation_rules.rules.splice(i, 1);
      renderAdminForm();
    });
  });
}

function collectAdminForm() {
  // 收集 filters
  document.querySelectorAll('.filter-row').forEach((row, i) => {
    const name = row.querySelector(`[data-filter="${i}.name"]`)?.value || '';
    const desc = row.querySelector(`[data-filter="${i}.description"]`)?.value || '';
    const pri = row.querySelector(`[data-filter="${i}.priority"]`)?.value || 'medium';
    if (!_adminRules.filters) _adminRules.filters = [];
    _adminRules.filters[i] = { name, description: desc, priority: pri };
  });

  // 收集字段偏好
  if (!_adminRules.field_preferences) _adminRules.field_preferences = {};
  const fp = _adminRules.field_preferences;
  fp.primary_metrics = ($('admin-form').querySelector('[data-bind="fp.primary"]')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
  fp.secondary_metrics = ($('admin-form').querySelector('[data-bind="fp.secondary"]')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
  fp.ignore_columns = ($('admin-form').querySelector('[data-bind="fp.ignore"]')?.value || '').split(',').map(s => s.trim()).filter(Boolean);

  // 收集行业背景
  if (!_adminRules.industry_specific) _adminRules.industry_specific = {};
  const ind = _adminRules.industry_specific;
  ind.current_industry = $('admin-form').querySelector('[data-bind="ind.industry"]')?.value || '';
  ind.business_objective = $('admin-form').querySelector('[data-bind="ind.objective"]')?.value || '';
  ind.compliance_constraints = ($('admin-form').querySelector('[data-bind="ind.compliance"]')?.value || '').split('\n').map(s => s.trim()).filter(Boolean);

  // 收集输出格式
  if (!_adminRules.output_style) _adminRules.output_style = {};
  const out = _adminRules.output_style;
  out.number_format = $('admin-form').querySelector('[data-bind="out.rate_format"]')?.value || 'rate_pct';
  out.decimal_places = parseInt($('admin-form').querySelector('[data-bind="out.decimals"]')?.value || '2');
  out.thousand_separator = $('admin-form').querySelector('[data-bind="out.thousand"]')?.checked || false;
  out.use_chinese_labels = $('admin-form').querySelector('[data-bind="out.chinese"]')?.checked || false;

  // 收集列特定格式规则
  out.format_rules = out.format_rules || [];
  const fmtRows = document.querySelectorAll('.format-rule-row');
  out.format_rules = []; // 清空后重写
  fmtRows.forEach((row, i) => {
    const name = row.querySelector(`[data-fr="${i}.name"]`)?.value?.trim() || '';
    const colsStr = row.querySelector(`[data-fr="${i}.columns"]`)?.value || '';
    const cols = colsStr.split(',').map(s => s.trim()).filter(Boolean);
    const dec = parseInt(row.querySelector(`[data-fr="${i}.decimals"]`)?.value || '2');
    const thou = row.querySelector(`[data-fr="${i}.thousand"]`)?.checked !== false;
    const prefix = row.querySelector(`[data-fr="${i}.prefix"]`)?.value || '';
    const suffix = row.querySelector(`[data-fr="${i}.suffix"]`)?.value || '';
    const mult = parseFloat(row.querySelector(`[data-fr="${i}.multiplier"]`)?.value || '1');
    const desc = row.querySelector(`[data-fr="${i}.description"]`)?.value || '';
    // 跳过完全空的行
    if (!name && cols.length === 0) return;
    out.format_rules.push({
      name, apply_to_columns: cols,
      decimal_places: dec, thousand_separator: thou,
      prefix, suffix, multiplier: mult, description: desc,
    });
  });

  // 收集指标计算规则
  if (!_adminRules.calculation_rules) _adminRules.calculation_rules = { rules: [] };
  if (!_adminRules.calculation_rules.rules) _adminRules.calculation_rules.rules = [];
  const calcRows = document.querySelectorAll('.calc-rule-row');
  _adminRules.calculation_rules.rules = []; // 清空后重写
  calcRows.forEach((row, i) => {
    const name = row.querySelector(`[data-cr="${i}.name"]`)?.value?.trim() || '';
    const formula = row.querySelector(`[data-cr="${i}.formula"]`)?.value?.trim() || '';
    const desc = row.querySelector(`[data-cr="${i}.description"]`)?.value || '';
    const category = row.querySelector(`[data-cr="${i}.category"]`)?.value || 'growth';
    const outF = row.querySelector(`[data-cr="${i}.output_format"]`)?.value || 'rate_pct';
    const pri = row.querySelector(`[data-cr="${i}.priority"]`)?.value || 'medium';
    // 跳过完全空的行
    if (!name && !formula) return;
    _adminRules.calculation_rules.rules.push({
      name, formula, description: desc,
      category, output_format: outF, priority: pri,
    });
  });

  // 保留 _version / _comment
  return _adminRules;
}

async function saveAdminRules() {
  const token = $('admin-token-input').value;
  if (!token) {
    $('admin-status').innerHTML = `<span class="st-err">${IC.alert} 请填写 Admin Token</span>`;
    return;
  }

  const rules = collectAdminForm();
  const content = JSON.stringify(rules, null, 2);

  $('admin-status').innerHTML = `<span class="st-neutral">${IC.spinner} 保存中...</span>`;
  $('admin-save').disabled = true;

  try {
    const fd = new FormData();
    fd.append('content', content);
    fd.append('token', token);
    const r = await fetch('/api/admin/rules', { method: 'POST', body: fd });
    if (!r.ok) {
      const err = await r.text();
      throw new Error(err);
    }
    const data = await r.json();
    $('admin-status').innerHTML = `<span class="st-ok">${IC.check} ${data.message}<br>路径:${data.path} · ${data.rules_count} 条过滤规则</span>`;
  } catch (e) {
    $('admin-status').innerHTML = `<span class="st-err">${IC.alert} 保存失败:${e.message}</span>`;
  } finally {
    $('admin-save').disabled = false;
  }
}

// ============================================================
// 记忆管理(用户习惯:自动学习 + 手动)
// ============================================================
let _memory = { _version: "1.0", habits: [] };

async function openMemoryModal() {
  $('memory-modal').classList.remove('hidden');
  $('memory-status').innerHTML = `<span class="st-neutral">${IC.spinner} 加载中...</span>`;
  await loadMemory();
}

function closeMemoryModal() {
  $('memory-modal').classList.add('hidden');
}

async function loadMemory() {
  $('memory-status').innerHTML = `<span class="st-neutral">${IC.spinner} 加载记忆...</span>`;
  try {
    const r = await fetch('/api/admin/memory');
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    _memory = JSON.parse(data.content);
    if (!_memory.habits) _memory.habits = [];
    renderMemoryForm();
    $('memory-status').innerHTML = `<span class="st-ok">${IC.check} 已加载:${data.path} · ${_memory.habits.length} 条习惯</span>`;
  } catch (e) {
    $('memory-status').innerHTML = `<span class="st-err">${IC.alert} 加载失败:${e.message}</span>`;
  }
}

function renderMemoryForm() {
  const habits = _memory.habits || [];

  let html = '';

  if (habits.length === 0) {
    html += `
      <div class="empty-state">
        <div class="icon-box">${IC.brain}</div>
        <p class="m">还没有习惯记忆</p>
        <p class="s">用几次后,agent 会自动从对话中学习;也可以点下方按钮手动加</p>
      </div>
    `;
  } else {
    // 列表头
    html += `
      <div class="mem-head">
        <div class="c2">分类/键名</div>
        <div class="c4">偏好值</div>
        <div class="c2">置信度</div>
        <div class="c2">来源/时间</div>
        <div class="c1">来源</div>
        <div class="c1">操作</div>
      </div>
    `;
  }

  habits.forEach((h, i) => {
    html += renderMemoryRow(h, i);
  });

  html += `
    <div class="mem-addbar">
      <button id="memory-add" class="btn-grad">${IC.plus} 手动添加习惯</button>
      <span class="hint">手动添加的标记为 Manual,不会影响自动学习</span>
    </div>
  `;

  $('memory-form').innerHTML = html;

  // 绑定添加按钮
  $('memory-add').addEventListener('click', () => {
    _memory.habits = _memory.habits || [];
    _memory.habits.push({
      key: '',
      value: '',
      category: 'general',
      description: '',
      confidence: 0.7,
      source: 'manual',
      evidence_count: 0,
      learned_from: '(手动添加)',
      created_at: new Date().toISOString().slice(0, 19),
      updated_at: new Date().toISOString().slice(0, 19),
    });
    renderMemoryForm();
  });

  // 绑定删除按钮
  document.querySelectorAll('.memory-row-del').forEach((btn) => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i, 10);
      _memory.habits.splice(i, 1);
      renderMemoryForm();
    });
  });

  // 绑定置信度数字 + slider 联动
  document.querySelectorAll('[data-conf-slider]').forEach((slider) => {
    slider.addEventListener('input', (e) => {
      const i = e.target.dataset.i;
      const numEl = document.querySelector(`[data-conf-num="${i}"]`);
      if (numEl) numEl.value = e.target.value;
    });
  });
}

function renderMemoryRow(h, i) {
  const conf = (h.confidence || 0.5).toFixed(2);
  const source = h.source || 'auto';
  const sourceBadge = source === 'manual'
    ? '<span class="src-badge src-manual">Manual</span>'
    : '<span class="src-badge src-auto">Auto</span>';

  return `
    <div class="rule-row memory-row" data-index="${i}">
      <div class="form-grid">
        <div class="c2 mem-key-col">
          <select data-mem="${i}.category" class="input-modern">
            <option value="chart" ${h.category === 'chart' ? 'selected' : ''}>chart</option>
            <option value="filter" ${h.category === 'filter' ? 'selected' : ''}>filter</option>
            <option value="metric" ${h.category === 'metric' ? 'selected' : ''}>metric</option>
            <option value="format" ${h.category === 'format' ? 'selected' : ''}>format</option>
            <option value="domain" ${h.category === 'domain' ? 'selected' : ''}>domain</option>
            <option value="style" ${h.category === 'style' ? 'selected' : ''}>style</option>
            <option value="general" ${!h.category || h.category === 'general' ? 'selected' : ''}>general</option>
          </select>
          <input data-mem="${i}.key" value="${escapeHtml(h.key || '')}" class="input-modern font-mono" placeholder="key(英文,稳定)">
        </div>
        <div class="c4 mem-val-col">
          <input data-mem="${i}.value" value="${escapeHtml(h.value || '')}" class="input-modern" placeholder="具体可执行的值">
          <input data-mem="${i}.description" value="${escapeHtml(h.description || '')}" class="input-modern input-sub" placeholder="一句话中文描述">
        </div>
        <div class="c2">
          <div class="conf-row">
            <input type="range" data-conf-slider="${i}" data-i="${i}" min="0" max="1" step="0.05" value="${h.confidence || 0.5}" class="conf-range">
            <input type="number" data-conf-num="${i}" data-mem="${i}.confidence" min="0" max="1" step="0.05" value="${conf}" class="conf-num">
          </div>
          <div class="conf-evidence">${(h.evidence_count || 0)} 次证据</div>
        </div>
        <div class="c2 mem-meta">
          <div class="mem-from" title="${escapeHtml(h.learned_from || '')}">${IC.pen} ${escapeHtml((h.learned_from || '').slice(0, 20))}</div>
          <div class="mem-time">${IC.clock} ${escapeHtml((h.updated_at || '').slice(0, 16))}</div>
        </div>
        <div class="c1 src-cell">${sourceBadge}</div>
        <div class="c1 del-cell">
          <button class="icon-del memory-row-del" data-i="${i}" title="删除">${IC.trash}</button>
        </div>
      </div>
    </div>
  `;
}

function collectMemoryForm() {
  // 从 form 收集到 _memory 对象
  const habits = _memory.habits || [];
  document.querySelectorAll('.memory-row').forEach((row, i) => {
    const get = (suffix) => row.querySelector(`[data-mem="${i}.${suffix}"]`)?.value || '';
    const h = habits[i] || (habits[i] = {});
    h.category = get('category');
    h.key = get('key').trim();
    h.value = get('value').trim();
    h.description = get('description').trim();
    h.confidence = Math.max(0, Math.min(1, parseFloat(row.querySelector(`[data-mem="${i}.confidence"]`)?.value || 0.5)));
    // 时间戳自动更新
    h.updated_at = new Date().toISOString().slice(0, 19);
  });
  _memory.habits = habits.filter(h => h.key && h.value); // 空行不要
  return _memory;
}

async function saveMemory() {
  const token = $('memory-token-input').value;
  if (!token) {
    $('memory-status').innerHTML = `<span class="st-err">${IC.alert} 请填写 Admin Token</span>`;
    return;
  }

  const mem = collectMemoryForm();
  const content = JSON.stringify(mem, null, 2);

  $('memory-status').innerHTML = `<span class="st-neutral">${IC.spinner} 保存中...</span>`;
  $('memory-save').disabled = true;

  try {
    const fd = new FormData();
    fd.append('content', content);
    fd.append('token', token);
    const r = await fetch('/api/admin/memory', { method: 'POST', body: fd });
    if (!r.ok) {
      const err = await r.text();
      throw new Error(err);
    }
    const data = await r.json();
    $('memory-status').innerHTML = `<span class="st-ok">${IC.check} ${data.message}<br>路径:${data.path} · ${data.habits_count} 条习惯</span>`;
    // 重新读盘(防止 merge 冲突)
    setTimeout(loadMemory, 500);
  } catch (e) {
    $('memory-status').innerHTML = `<span class="st-err">${IC.alert} 保存失败:${e.message}</span>`;
  } finally {
    $('memory-save').disabled = false;
  }
}

$('memory-btn').addEventListener('click', openMemoryModal);
$('memory-close').addEventListener('click', closeMemoryModal);
$('memory-save').addEventListener('click', saveMemory);
$('memory-reload').addEventListener('click', loadMemory);
$('memory-modal').addEventListener('click', e => {
  if (e.target.id === 'memory-modal') closeMemoryModal();
});

bootstrap();
</script>
